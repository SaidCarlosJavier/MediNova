# Perfil de producción (SPRING_PROFILES_ACTIVE=prod)
# El esquema debe existir (usar un script/migración): Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
app.seed.enabled=${SEED_ENABLED:false}
logging.level.root=WARN
logging.level.pe.gob.valdizan=INFO
# Swagger deshabilitado en producción (descomentar para habilitarlo)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

