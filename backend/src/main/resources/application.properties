# =====================================================================
# Hospital Hermilio Valdizán - Configuración común (todos los perfiles)
# El perfil activo por defecto es "dev". Para producción: SPRING_PROFILES_ACTIVE=prod
# =====================================================================
spring.application.name=citas-valdizan
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Servidor -----------------------------------------------------------
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024
# Nunca exponer trazas ni mensajes internos en las respuestas de error
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
# RNF-03 (HTTPS en producción): ver application-prod.properties (server.ssl.*)

# --- Base de datos MySQL 8 (variables de entorno con valores por defecto) --
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_valdizan?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Pool HikariCP (dimensionado para un hospital de consulta externa) ----
spring.datasource.hikari.pool-name=valdizan-pool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# --- JPA / Hibernate -------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# --- Jackson: zona horaria Lima, fechas ISO, sin nulos --------------------
spring.jackson.time-zone=America/Lima
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Localización (es-PE) --------------------------------------------------
spring.web.locale=es-PE
spring.web.locale-resolver=fixed

# --- Seguridad JWT (RNF-02/03). CAMBIAR JWT_SECRET en producción (>= 32 caracteres)
app.jwt.secret=${JWT_SECRET:valdizan-clave-secreta-solo-para-desarrollo-cambiar-en-produccion-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS y enlaces ----------------------------------------------------------
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# --- Correo (RF-03/RF-11..13). false = solo se registra en el log (simulado)
app.correo.habilitado=${CORREO_HABILITADO:false}
app.correo.remitente=${CORREO_REMITENTE:no-reply@valdizan.gob.pe}
# Para correo real: spring.mail.host, spring.mail.port, spring.mail.username, spring.mail.password
app.recuperacion.minutos=30

# --- Tareas programadas (@Scheduled): recordatorio 24 h antes e inasistencias
app.scheduling.enabled=true
app.recordatorio.cron=0 0 8 * * *
app.inasistencia.cron=0 50 23 * * *
app.seed.enabled=true

# --- Documentación OpenAPI -------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# --- Actuator (RNF-09/16): /actuator/health ---------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Logging ---------------------------------------------------------------
logging.level.root=INFO
logging.level.pe.gob.valdizan=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# --- Respaldos (RNF-15) -----------------------------------------------------
# Respaldo diario recomendado con mysqldump (ver README):
#   mysqldump -u root -p --single-transaction --routines hospital_valdizan > respaldo_$(date +%F).sql
