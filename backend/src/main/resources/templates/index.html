<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Hospital Hermilio Valdizán</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #F4F5F7; color: #2B2F36; }
        .hero { background: linear-gradient(135deg, #0B3C6B, #1E88C8); color: #fff; padding: 4rem 0; }
        .btn-azul { background: #1E88C8; color: #fff; border-radius: 50px; padding: .6rem 1.6rem; }
        .btn-azul:hover { background: #0B3C6B; color: #fff; }
    </style>
</head>
<body>
<section class="hero text-center">
    <div class="container">
        <h1 class="fw-bold">Hospital Hermilio Valdizán</h1>
        <p class="lead mb-0">API de gestión de citas — <span th:text="${nombre}">citas-valdizan</span></p>
    </div>
</section>
<main class="container py-5" style="max-width: 760px">
    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body p-4 d-flex align-items-center justify-content-between">
            <div>
                <h2 class="h5 fw-bold mb-1">Estado de la API</h2>
                <p class="mb-0 text-muted">El servicio se encuentra en ejecución.</p>
            </div>
            <span class="badge text-bg-success fs-6">Operativa</span>
        </div>
    </div>
    <div class="row g-3">
        <div class="col-md-4"><a class="btn btn-azul w-100" href="/swagger-ui.html">Documentación Swagger</a></div>
        <div class="col-md-4"><a class="btn btn-azul w-100" href="/actuator/health">Estado (health)</a></div>
        <div class="col-md-4"><a class="btn btn-azul w-100" th:href="${frontendUrl}">Ir al sistema web</a></div>
    </div>
</main>
</body>
</html>
