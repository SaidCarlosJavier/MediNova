spring.application.name=sistema-hospitalario

# ==============================
# Servidor
# ==============================
server.port=8080

# ==============================
# Base de datos (PostgreSQL)
# Ajustar credenciales segun el entorno. Se recomienda usar variables de entorno
# en produccion: ${DB_URL}, ${DB_USERNAME}, ${DB_PASSWORD}
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/medicare_plus
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================
# JWT
# Clave secreta de al menos 256 bits (32 caracteres) para HS256.
# En produccion definir mediante variable de entorno: ${JWT_SECRET}
# ==============================
app.jwt.secret=CambiarEstaClaveSecretaPorUnaMuchoMasSeguraEnProduccion123456
app.jwt.expiration-ms=86400000

# ==============================
# Jackson
# ==============================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
